<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VKU AR - WebXR Demo</title>

<style>
body { margin:0; overflow:hidden; font-family: sans-serif; background:#000; }

/* canvas AR */
canvas { position: fixed; top:0; left:0; width:100%; height:100%; }

/* nút start */
#start-ar {
  position: fixed; bottom: 20px; left:50%;
  transform: translateX(-50%);
  padding: 12px 20px;
  background: #00e5ff; border:none;
  border-radius: 10px;
  font-weight: bold;
  z-index: 10;
}

/* menu */
#side-menu {
  position: fixed;
  left: -100%;
  top:0;
  width: 280px;
  height:100%;
  background: rgba(0,0,0,0.9);
  transition: 0.3s;
  padding: 15px;
  overflow-y: auto;
  z-index: 20;
}
#side-menu.open { left:0; }

.model {
  background:#111;
  margin-bottom:10px;
  padding:10px;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}
.model:hover { background:#00e5ff; color:#000; }

#status {
  position: fixed;
  top:20px;
  left:50%;
  transform: translateX(-50%);
  color:white;
  background: rgba(0,0,0,0.6);
  padding:8px 12px;
  border-radius:8px;
  z-index:10;
}
</style>
</head>

<body>

<div id="status">Nhấn Start AR</div>
<button id="start-ar">🚀 Start AR</button>

<div id="side-menu"></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160/examples/jsm/loaders/GLTFLoader.js';

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

/* ================= FIREBASE ================= */
const firebaseConfig = {
  apiKey: "AIzaSyCQjyaUgKxHqgfW3aaxsgwxUfOPePCkVVA",
  authDomain: "YOUR_DOMAIN",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ================= THREE + XR ================= */
let scene, camera, renderer;
let controller, reticle;
let hitTestSource = null;
let localSpace = null;

let currentModelUrl = null;
let isSurfaceDetected = false;

const loader = new GLTFLoader();

init();

function init() {
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  renderer = new THREE.WebGLRenderer({ alpha:true, antialias:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  document.body.appendChild(renderer.domElement);

  // ánh sáng
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  // controller
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  // reticle
  const geo = new THREE.RingGeometry(0.1, 0.15, 32);
  const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
  reticle = new THREE.Mesh(geo, mat);
  reticle.rotation.x = -Math.PI / 2;
  reticle.visible = false;
  scene.add(reticle);

  document.getElementById("start-ar").onclick = startAR;
}

/* ================= START AR ================= */
async function startAR() {
  const session = await navigator.xr.requestSession('immersive-ar', {
    requiredFeatures: ['hit-test']
  });

  renderer.xr.setSession(session);

  const viewerSpace = await session.requestReferenceSpace('viewer');
  localSpace = await session.requestReferenceSpace('local');

  hitTestSource = await session.requestHitTestSource({
    space: viewerSpace
  });

  renderer.setAnimationLoop(render);

  document.getElementById("start-ar").style.display = "none";
  document.getElementById("status").innerText = "Di chuyển để quét mặt phẳng...";
}

/* ================= RENDER ================= */
function render(timestamp, frame) {
  if (frame && hitTestSource) {
    const hits = frame.getHitTestResults(hitTestSource);

    if (hits.length > 0) {
      const hit = hits[0];
      const pose = hit.getPose(localSpace);

      reticle.visible = true;
      reticle.matrix.fromArray(pose.transform.matrix);

      if (!isSurfaceDetected) {
        isSurfaceDetected = true;

        document.getElementById("status").innerText = "Chọn vật thể để đặt";
        document.getElementById("side-menu").classList.add("open");

        loadMenu();
      }

    } else {
      reticle.visible = false;
    }
  }

  renderer.render(scene, camera);
}

/* ================= ĐẶT OBJECT ================= */
function onSelect() {
  if (!reticle.visible || !currentModelUrl) return;

  loader.load(currentModelUrl, (gltf) => {
    const model = gltf.scene.clone();

    model.position.setFromMatrixPosition(reticle.matrix);
    model.scale.set(0.3,0.3,0.3);

    scene.add(model);
  });
}

/* ================= LOAD MENU ================= */
async function loadMenu() {
  const snapshot = await getDocs(collection(db, "models"));
  const menu = document.getElementById("side-menu");

  menu.innerHTML = "<h3 style='color:white'>Chọn vật thể</h3>";

  snapshot.forEach(doc => {
    const data = doc.data();

    const div = document.createElement("div");
    div.className = "model";
    div.innerText = data.name;

    div.onclick = () => {
      currentModelUrl = data.url;
    };

    menu.appendChild(div);
  });
}
</script>

</body>
</html>
