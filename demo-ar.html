<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VKU AR - Spatial Builder Ultimate</title>
    
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/components.js" defer></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow-x: hidden; }

        /* KHUNG CHỨA 3D TRÊN WEB MẶC ĐỊNH */
        #ar-viewport {
            width: 100%; height: 50vh; border-radius: 16px; position: relative; background-color: #0b1426; overflow: hidden;
            background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            background-size: 30px 30px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center;
        }

        /* TÙY CHỈNH NÚT START AR CỦA THREE.JS */
        #ARButton {
            position: absolute !important; bottom: 20px !important; left: 50% !important; transform: translateX(-50%) !important;
            background: var(--vku-red, #c8102e) !important; color: white !important; padding: 14px 28px !important; border-radius: 50px !important;
            font-family: 'Space Grotesk', sans-serif !important; font-weight: bold !important; border: 2px solid white !important;
            box-shadow: 0 10px 20px rgba(200, 16, 46, 0.5) !important; cursor: pointer !important; z-index: 1000 !important;
        }

        /* --- UI OVERLAY: GIAO DIỆN HIỂN THỊ TRONG CAMERA AR --- */
        #ar-ui-layer {
            display: none; /* Chỉ hiện khi vào AR */
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 99999;
            pointer-events: none; /* Cực kỳ quan trọng: Cho phép chạm xuyên qua UI xuống sàn nhà */
            flex-direction: column; justify-content: flex-end; padding-bottom: 25px;
        }

        #status-badge {
            align-self: center; background: rgba(0,0,0,0.6); color: #00e5ff; padding: 8px 16px; border-radius: 20px;
            font-size: 14px; font-weight: bold; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); backdrop-filter: blur(5px);
        }

        /* 1. MENU CHỌN MÔ HÌNH (BUILD MENU) */
        #build-menu {
            display: flex; overflow-x: auto; gap: 15px; padding: 10px; margin-bottom: 10px; width: 100%;
            scrollbar-width: none; pointer-events: auto; /* Bật chạm cho menu */
            justify-content: center;
        }
        #build-menu::-webkit-scrollbar { display: none; }
        
        .model-card {
            flex: 0 0 auto; width: 100px; background: rgba(1, 60, 120, 0.8); border: 2px solid transparent; border-radius: 16px;
            padding: 10px; text-align: center; cursor: pointer; color: white; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .model-card.active { border-color: #f2a900; background: rgba(242, 169, 0, 0.2); box-shadow: 0 0 15px rgba(242, 169, 0, 0.5); }
        .model-icon { font-size: 24px; margin-bottom: 5px; }
        .model-name { font-size: 11px; font-weight: bold; font-family: sans-serif;}

        /* 2. BẢNG ĐIỀU KHIỂN (EDIT MENU) - Hiện khi chạm vào vật đã thả */
        #edit-menu {
            display: none; flex-wrap: wrap; justify-content: center; gap: 8px; background: rgba(0, 0, 0, 0.7);
            padding: 15px; border-radius: 20px; margin: 0 auto 15px auto; pointer-events: auto; /* Bật chạm */
            backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); max-width: 90%;
        }
        .ctrl-btn {
            background: rgba(255, 255, 255, 0.2); color: white; border: none; border-radius: 10px; padding: 10px 12px;
            font-size: 14px; cursor: pointer; display: flex; align-items: center; font-weight: bold; transition: 0.2s;
        }
        .ctrl-btn:active { transform: scale(0.9); background: rgba(255, 255, 255, 0.4); }
        .ctrl-btn.danger { background: rgba(200, 16, 46, 0.8); }
        .ctrl-btn.success { background: rgba(0, 229, 255, 0.8); color: black; }
    </style>
</head>
<body>

    <vku-header></vku-header>

    <main>
        <h1 class="gradient-text" style="text-align: center; font-size: 2.2rem; margin-top: 20px;">Trạm Thiết Kế AR</h1>
        
        <div style="max-width: 700px; margin: 0 auto 20px auto; background: rgba(242, 169, 0, 0.1); border: 1px solid var(--vku-gold, #f2a900); padding: 15px; border-radius: 12px; text-align: center;">
            <p style="color: var(--vku-blue, #013c78); margin: 0; font-size: 14px; line-height: 1.5;">
                <strong><span style="font-size: 16px">🛠️</span> CÁCH CHƠI:</strong><br>
                Lia camera tìm vòng tròn -> <strong>Chạm màn hình để thả vật</strong>.<br>
                <strong>Chạm vào vật đã thả</strong> để mở bảng điều khiển (Xoay, Thu Phóng, Nâng, Xóa).
            </p>
        </div>

        <div class="ar-container" style="max-width: 900px; margin: 0 auto; padding: 0; border: none; background: transparent; box-shadow: none;">
            
            <div id="ar-viewport">
                <p id="loading-text" style="color: white; font-weight: bold;">Đang nạp động cơ 3D...</p>
            </div>

            <div id="ar-ui-layer">
                <div id="status-badge">Hãy lia camera xuống sàn nhà</div>
                
                <div id="edit-menu">
                    <button class="ctrl-btn" id="btn-scale-down">➖ Nhỏ</button>
                    <button class="ctrl-btn" id="btn-scale-up">➕ To</button>
                    <button class="ctrl-btn" id="btn-rotate">↻ Xoay</button>
                    <button class="ctrl-btn" id="btn-up">⬆️ Lên</button>
                    <button class="ctrl-btn" id="btn-down">⬇️ Xuống</button>
                    <button class="ctrl-btn danger" id="btn-delete">🗑️ Xóa</button>
                    <button class="ctrl-btn success" id="btn-done">✔️ Xong</button>
                </div>

                <div id="build-menu">
                    <div class="model-card active" data-src="models/living room_furniture.glb">
                        <div class="model-icon">🛋️</div><div class="model-name">Phòng Khách</div>
                    </div>
                    <div class="model-card" data-src="models/phong_hoc_ve.glb">
                        <div class="model-icon">🏫</div><div class="model-name">Giá Vẽ</div>
                    </div>
                    <div class="model-card" data-src="models/Meshy_AI_Elemental_Thunderbird_0314181252_texture.glb">
                        <div class="model-icon">🦅</div><div class="model-name">Chim Sấm</div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <vku-footer></vku-footer>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let camera, scene, renderer, controller, reticle;
        let hitTestSource = null, hitTestSourceRequested = false;

        let currentModel = null; 
        const loader = new GLTFLoader();

        // BIẾN TRẠNG THÁI GAME
        let placedObjects = [];      // Các vật thể đã thả
        let selectedObject = null;   // Vật thể đang chọn để sửa
        let selectionBox = null;     // Khung viền màu đỏ báo hiệu đang chọn
        let raycaster = new THREE.Raycaster();

        // KẾT NỐI GIAO DIỆN
        const uiLayer = document.getElementById('ar-ui-layer');
        const buildMenu = document.getElementById('build-menu');
        const editMenu = document.getElementById('edit-menu');
        const statusBadge = document.getElementById('status-badge');
        const loadingText = document.getElementById('loading-text');

        init();
        animate();

        function init() {
            const viewport = document.getElementById('ar-viewport');
            
            // 1. TẠO SCENE & CAMERA
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, viewport.clientWidth / viewport.clientHeight, 0.01, 20);

            // 2. TẠO ÁNH SÁNG
            const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 2); light.position.set(0.5, 1, 0.25); scene.add(light);
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5); dirLight.position.set(1, 4, 2); scene.add(dirLight);

            // 3. TẠO RENDERER WEBGL
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(viewport.clientWidth, viewport.clientHeight);
            renderer.xr.enabled = true; // Bật chế độ AR
            
            viewport.innerHTML = ''; 
            viewport.appendChild(renderer.domElement);

            // 4. KHỞI TẠO NÚT AR VÀ ÉP DOM OVERLAY LÊN TOÀN MÀN HÌNH (SỬA LỖI IOS)
            viewport.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'], 
                optionalFeatures: ['dom-overlay'], 
                domOverlay: { root: document.body } // Ép dính vào Body để không bị lỗi trên iPhone
            }));

            // 5. TẠO VÒNG NGẮM DƯỚI SÀN (RETICLE)
            reticle = new THREE.Mesh(new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

            // 6. TẠO KHUNG VIỀN ĐỎ BAO QUANH VẬT ĐƯỢC CHỌN
            selectionBox = new THREE.BoxHelper(reticle, 0xff0000);
            selectionBox.material.depthTest = false; // Xuyên thấu để luôn nhìn thấy viền
            selectionBox.visible = false;
            scene.add(selectionBox);

            // 7. BẮT SỰ KIỆN CHẠM MÀN HÌNH
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            // 8. CÀI ĐẶT UI & TẢI MÔ HÌNH MẶC ĐỊNH
            setupUI();
            loadModel("models/living room_furniture.glb");

            // 9. LẮNG NGHE SỰ KIỆN BẬT/TẮT CAMERA
            renderer.xr.addEventListener('sessionstart', () => { 
                uiLayer.style.display = 'flex'; // Hiện UI khi vào AR
                statusBadge.innerText = "Đang dò mặt phẳng...";
            });
            renderer.xr.addEventListener('sessionend', () => { 
                uiLayer.style.display = 'none'; // Ẩn UI khi thoát
            });

            window.addEventListener('resize', onWindowResize);
        }

        // --- CÀI ĐẶT SỰ KIỆN CỦA CÁC NÚT BẤM (UI LOGIC) ---
        function setupUI() {
            // Chuyển thẻ mô hình
            document.querySelectorAll('.model-card').forEach(card => {
                card.addEventListener('click', (e) => {
                    const src = e.currentTarget.getAttribute('data-src');
                    document.querySelectorAll('.model-card').forEach(c => c.classList.remove('active'));
                    e.currentTarget.classList.add('active');
                    loadModel(src);
                });
            });

            // Chức năng Edit (Thu/Phóng/Xoay/Dịch chuyển cao độ)
            document.getElementById('btn-scale-up').addEventListener('click', () => { if(selectedObject) { selectedObject.scale.multiplyScalar(1.2); updateSelectionBox(); } });
            document.getElementById('btn-scale-down').addEventListener('click', () => { if(selectedObject) { selectedObject.scale.multiply
