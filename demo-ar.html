<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo AR - VKU AR DrawRoom</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/components.js" defer></script>
    <script
      type="module"
      src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"
    ></script>

    <!-- Thêm CSS riêng cho Menu chọn mô hình kiểu App Mobile -->
    <style>
      .model-carousel {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding: 15px 5px;
        margin-top: 15px;
        /* Ẩn thanh cuộn cho đẹp */
        scrollbar-width: none; 
        -ms-overflow-style: none; 
      }
      .model-carousel::-webkit-scrollbar {
        display: none; 
      }
      
      .model-card {
        flex: 0 0 auto;
        width: 110px;
        background: rgba(18, 35, 67, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--text-muted);
        backdrop-filter: blur(5px);
      }
      
      .model-card:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-3px);
      }
      
      /* Hiệu ứng khi Card đang được chọn */
      .model-card.active {
        border-color: var(--ar-cyan, #00e5ff);
        background: rgba(0, 229, 255, 0.08);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0, 229, 255, 0.1);
      }
      
      .model-icon {
        font-size: 28px;
        margin-bottom: 8px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      }
      
      .model-name {
        font-size: 12px;
        font-weight: 600;
        font-family: 'Space Grotesk', sans-serif;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="loader-core"></div>
      <div class="loader-text">INITIALIZING AR CAMERA...</div>
    </div>

    <vku-header></vku-header>

    <main>
      <h1 class="gradient-text" style="text-align: center; font-size: 2.8rem">
        Truy Cập AR Camera
      </h1>

      <div
        style="
          max-width: 700px;
          margin: 0 auto 30px auto;
          background: rgba(255, 193, 7, 0.1);
          border: 1px solid rgba(255, 193, 7, 0.3);
          padding: 15px 25px;
          border-radius: 12px;
          text-align: center;
        "
      >
        <p style="color: var(--vku-gold); margin: 0; font-size: 15px">
          <strong><span style="font-size: 18px">⚠️</span> PROTOCOL:</strong>
          Vuốt chọn mô hình bên dưới. Nhấn nút <strong>Khởi động Hologram</strong> trên điện thoại để mở Camera và quét mặt sàn.
        </p>
      </div>

      <div class="ar-container" style="max-width: 900px; margin: 0 auto">
        
        <!-- KHUNG HIỂN THỊ MÔ HÌNH -->
        <model-viewer
          id="ar-viewer"
          src="models/living room_furniture.glb"
          ar
          ar-modes="webxr scene-viewer quick-look"
          camera-controls
          shadow-intensity="1.5"
          environment-image="neutral"
          style="width: 100%; height: 50vh; border-radius: 16px;"
        >
          <button slot="ar-button" class="ar-button">
            <svg
              viewBox="0 0 24 24"
              style="width: 20px; height: 20px; fill: currentColor"
            >
              <path
                d="M21,16H3V4H21M21,2H3C1.89,2 1,2.89 1,4V16A2,2 0 0,0 3,18H10V20H8V22H16V20H14V18H21A2,2 0 0,0 23,16V4C23,2.89 22.1,2 21,2Z"
              />
            </svg>
            Khởi động Hologram
          </button>

          <div
            slot="progress-bar"
            style="
              background: linear-gradient(90deg, transparent, var(--vku-red));
              height: 4px;
              display: block;
              position: absolute;
              bottom: 0;
              width: 100%;
            "
          ></div>
        </model-viewer>

        <!-- DANH SÁCH CHỌN MÔ HÌNH (CAROUSEL) -->
        <div class="model-carousel">
            
            <!-- Thẻ 1 -->
            <div class="model-card active" onclick="selectModel('models/living room_furniture.glb', this)">
                <div class="model-icon">🛋️</div>
                <div class="model-name">Phòng Khách</div>
            </div>

            <!-- Thẻ 2 -->
            <div class="model-card" onclick="selectModel('models/phong_hoc_thpt_phong_phu.glb', this)">
                <div class="model-icon">🏫</div>
                <div class="model-name">Phòng Vẽ VKU</div>
            </div>

            <!-- Thẻ 3 -->
            <div class="model-card" onclick="selectModel('models/Meshy_AI_Elemental_Thunderbird_0314181252_texture.glb', this)">
                <div class="model-icon">🦅</div>
                <div class="model-name">Thunderbird</div>
            </div>

            <!-- BẠN CÓ THỂ COPY THÊM THẺ (CARD) Ở ĐÂY NẾU CÓ THÊM MÔ HÌNH -->
            <!-- <div class="model-card" onclick="selectModel('models/ten_file_cua_ban.glb', this)">
                <div class="model-icon">🗿</div>
                <div class="model-name">Tượng Thạch Cao</div>
            </div> -->

        </div>
      </div>
    </main>

    <vku-footer></vku-footer>

    <!-- SCRIPT XỬ LÝ CHUYỂN ĐỔI MÔ HÌNH -->
    <script>
      function selectModel(srcUrl, clickedCard) {
        // 1. Thay đổi nguồn file 3D của model-viewer
        const viewer = document.getElementById('ar-viewer');
        viewer.src = srcUrl;

        // 2. Xóa trạng thái 'active' (phát sáng) ở tất cả các thẻ
        const allCards = document.querySelectorAll('.model-card');
        allCards.forEach(card => card.classList.remove('active'));

        // 3. Thêm trạng thái 'active' cho thẻ vừa được bấm
        clickedCard.classList.add('active');
      }
    </script>
  </body>
</html>
