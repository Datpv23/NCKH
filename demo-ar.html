<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>VKU AR - Hệ Thống Thiết Kế Nội Thất</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background: #0b1426; }
        /* Giữ nguyên Style của bạn và bổ sung các lớp hỗ trợ AR */
        .ar-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
        #status-bar { position: absolute; top: 80px; width: 100%; text-align: center; color: #00e5ff; font-weight: bold; z-index: 5; text-shadow: 0 0 5px rgba(0,0,0,0.5); pointer-events: none; }
        
        .side-menu {
            position: absolute; top: 0; left: -100%; width: 300px; height: 100%;
            background: rgba(11, 20, 38, 0.9); z-index: 100; transition: left 0.4s ease; 
            display: flex; flex-direction: column; border-right: 1px solid var(--ar-cyan); backdrop-filter: blur(15px);
        }
        .side-menu.open { left: 0; }

        /* Menu chỉnh sửa (Edit Menu) từ code 1 */
        #edit-menu { 
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); 
            display: none; background: rgba(18, 35, 67, 0.95); padding: 15px; border-radius: 20px; 
            z-index: 110; border: 1px solid #4caf50; width: 85vw; max-width: 350px; color: white;
        }
        .slider-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; font-size: 13px; }
        .slider-row input { flex: 1; accent-color: #4caf50; }
        .edit-controls { display: flex; gap: 10px; }
        .edit-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        #btn-delete { background: #ff4d4d; color: white; }
        #btn-done { background: #4caf50; color: white; }

        #loading-spinner { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; border: 4px solid rgba(0,229,255,0.3); border-top: 4px solid #00e5ff; border-radius: 50%; animation: spin 1s linear infinite; z-index: 200; }
        @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
        
        canvas { display: block; }
    </style>
</head>
<body>
    <div id="status-bar">Đang khởi tạo hệ thống...</div>
    <div id="loading-spinner"></div>

    <div class="ar-container" id="container">
        <button class="menu-toggle-btn" style="position: absolute; top: 15px; left: 15px; z-index: 101;" onclick="toggleMenu()">☰ Menu Đồ Vật</button>

        <!-- SIDEBAR MENU -->
        <div id="side-menu" class="side-menu">
            <div class="menu-header" style="display: flex; justify-content: space-between; padding: 20px; color: white; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <button id="back-btn" onclick="renderCategories()" style="background:none; border:none; color:white; display:none;">⬅</button>
                <h3 id="menu-title" style="margin:0; font-size: 16px;">Danh Mục</h3>
                <button onclick="toggleMenu()" style="background:none; border:none; color:white;">✖</button>
            </div>
            <div id="menu-content" class="menu-content" style="flex:1; overflow-y:auto; padding:15px;"></div>
        </div>

        <!-- EDIT MENU -->
        <div id="edit-menu">
            <div style="text-align:center; font-size:12px; margin-bottom:10px; color:#00e5ff;">HIỆU CHỈNH VẬT THỂ</div>
            <div class="slider-row">
                <label>Xoay:</label>
                <input type="range" id="slider-rotate" min="0" max="360" value="0">
            </div>
            <div class="slider-row">
                <label>Chiều cao:</label>
                <input type="range" id="slider-height" min="-1" max="3" step="0.05" value="0">
            </div>
            <div class="edit-controls">
                <button id="btn-delete" class="edit-btn">Xóa</button>
                <button id="btn-done" class="edit-btn">Hoàn tất</button>
            </div>
        </div>
    </div>

    <!-- IMPORT MAPS -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCQjyaUgKxHqgfW3aaxsgwxUfOPePCkVVA",
            authDomain: "vku-ar-project.firebaseapp.com",
            projectId: "vku-ar-project",
            storageBucket: "vku-ar-project.firebasestorage.app",
            messagingSenderId: "595437202444",
            appId: "1:595437202444:web:7939802383d326eee75229"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- BIẾN TOÀN CỤC ---
        let camera, scene, renderer, controller, reticle;
        let hitTestSource = null, hitTestSourceRequested = false;
        let currentModelUrl = null, activeObject = null, mainRoom = null;
        let isClickingUI = false, planeFound = false;
        const placedObjects = [];
        const gltfLoader = new GLTFLoader();
        const raycaster = new THREE.Raycaster();
        
        let modelDatabase = {}, categoryDisplayNames = {};

        init();
        animate();

        async function init() {
            const container = document.getElementById('container');
            
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

            const light = new THREE.AmbientLight(0xffffff, 2);
            scene.add(light);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            document.body.appendChild(ARButton.createButton(renderer, { 
                requiredFeatures: ['hit-test'],
                optionalFeatures: ['dom-overlay'],
                domOverlay: { root: document.body }
            }));

            // Reticle (Vòng tròn chỉ định)
            const ringGeo = new THREE.RingGeometry(0.1, 0.12, 32).rotateX(-Math.PI / 2);
            reticle = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x00e5ff }));
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Controller
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect);
            scene.add(controller);

            setupUIEvents();
            await fetchFromFirebase();
            
            window.addEventListener('resize', onWindowResize);
        }

        // --- XỬ LÝ CHỌN VÀ ĐẶT VẬT THỂ ---
        function onSelect() {
            if (!reticle.visible || isClickingUI) return;

            // Kiểm tra xem có chạm vào vật thể hiện có không (để sửa)
            const tempMatrix = new THREE.Matrix4().identity().extractRotation(controller.matrixWorld);
            raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
            raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

            const intersects = raycaster.intersectObjects(placedObjects, true);

            if (intersects.length > 0) {
                let obj = intersects[0].object;
                while (obj.parent && !placedObjects.includes(obj)) obj = obj.parent;
                
                if (placedObjects.includes(obj)) {
                    openEditMode(obj);
                    return;
                }
            }

            // Nếu đang chọn một model từ menu thì tiến hành đặt
            if (currentModelUrl) {
                placeModel(currentModelUrl);
            }
        }

        function placeModel(url) {
            document.getElementById('loading-spinner').style.display = "block";
            document.getElementById('status-bar').innerText = "Đang tải Hologram...";

            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                const wrapper = new THREE.Group();
                
                // Cấu hình vị trí dựa trên Reticle
                wrapper.position.setFromMatrixPosition(reticle.matrix);
                wrapper.quaternion.setFromRotationMatrix(reticle.matrix);
                
                // Xử lý nếu là Căn phòng (Room)
                const isRoom = url.toLowerCase().includes('room') || url.toLowerCase().includes('phong');
                
                model.traverse(n => { if(n.isMesh) n.material.side = THREE.DoubleSide; });

                wrapper.add(model);
                scene.add(wrapper);
                placedObjects.push(wrapper);

                if (isRoom) {
                    mainRoom = wrapper;
                    // Tạo bounding box ảo để vật thể sau này bám vào bề mặt phòng
                    mainRoom.updateMatrixWorld(true);
                    const box = new THREE.Box3().setFromObject(mainRoom);
                    mainRoom.userData.box = box;
                    document.getElementById('status-bar').innerText = "Phòng đã khóa. Hãy đặt nội thất lên bàn/sàn ảo.";
                } else {
                    document.getElementById('status-bar').innerText = "Đã đặt vật thể thành công.";
                }

                currentModelUrl = null; 
                document.getElementById('loading-spinner').style.display = "none";
            });
        }

        // --- FIREBASE LOGIC ---
        async function fetchFromFirebase() {
            try {
                const catSnapshot = await getDocs(collection(db, "categories"));
                catSnapshot.forEach(doc => categoryDisplayNames[doc.id] = doc.data().name);

                const modelSnapshot = await getDocs(collection(db, "models"));
                modelSnapshot.forEach(doc => {
                    const data = doc.data();
                    const cat = data.category || "khac";
                    if (!modelDatabase[cat]) modelDatabase[cat] = [];
                    modelDatabase[cat].push({ name: data.name, url: data.url, image: data.image });
                });
                renderCategories();
            } catch (e) { console.error(e); }
        }

        window.renderCategories = function() {
            const content = document.getElementById('menu-content');
            document.getElementById('menu-title').innerText = "Danh Mục Đồ Vật";
            document.getElementById('back-btn').style.display = 'none';
            content.innerHTML = '';

            Object.keys(categoryDisplayNames).forEach(id => {
                const btn = document.createElement('div');
                btn.className = 'category-item'; // Dùng lại class CSS cũ của bạn
                btn.style.cssText = "background:rgba(255,255,255,0.05); padding:15px; margin-bottom:10px; border-radius:10px; color:white; cursor:pointer; display:flex; justify-content:space-between;";
                btn.innerHTML = `<span>${categoryDisplayNames[id]}</span> ❯`;
                btn.onclick = () => renderItems(id);
                content.appendChild(btn);
            });
        };

        function renderItems(catId) {
            const content = document.getElementById('menu-content');
            document.getElementById('menu-title').innerText = categoryDisplayNames[catId];
            document.getElementById('back-btn').style.display = 'block';
            content.innerHTML = '<div class="items-grid" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>';
            const grid = content.firstChild;

            (modelDatabase[catId] || []).forEach(item => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.style.cssText = "background:rgba(255,255,255,0.05); border-radius:10px; overflow:hidden; text-align:center; cursor:pointer;";
                card.innerHTML = `<img src="${item.image}" style="width:100%; height:80px; object-fit:cover;"><div style="color:white; padding:5px; font-size:11px;">${item.name}</div>`;
                card.onclick = () => {
                    currentModelUrl = item.url;
                    toggleMenu();
                    document.getElementById('status-bar').innerText = "Trỏ vào sàn và nhấn để đặt: " + item.name;
                };
                grid.appendChild(card);
            });
        }

        // --- UI & GESTURES ---
        function setupUIEvents() {
            const editMenu = document.getElementById('edit-menu');
            const sideMenu = document.getElementById('side-menu');

            const lock = () => isClickingUI = true;
            const unlock = () => setTimeout(() => isClickingUI = false, 300);

            [editMenu, sideMenu].forEach(ui => {
                ui.addEventListener('pointerdown', lock);
                ui.addEventListener('pointerup', unlock);
            });

            document.getElementById('btn-done').onclick = () => { activeObject = null; editMenu.style.display = 'none'; };
            document.getElementById('btn-delete').onclick = () => {
                if(activeObject) {
                    if(activeObject === mainRoom) mainRoom = null;
                    scene.remove(activeObject);
                    placedObjects.splice(placedObjects.indexOf(activeObject), 1);
                    activeObject = null;
                    editMenu.style.display = 'none';
                }
            };

            document.getElementById('slider-rotate').oninput = (e) => {
                if(activeObject) activeObject.rotation.y = THREE.MathUtils.degToRad(e.target.value);
            };

            document.getElementById('slider-height').oninput = (e) => {
                if(activeObject) activeObject.position.y = parseFloat(e.target.value);
            };
        }

        function openEditMode(obj) {
            activeObject = obj;
            document.getElementById('edit-menu').style.display = 'block';
            document.getElementById('slider-rotate').value = THREE.MathUtils.radToDeg(obj.rotation.y);
            document.getElementById('slider-height').value = obj.position.y;
        }

        window.toggleMenu = function() {
            document.getElementById('side-menu').classList.toggle('open');
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- VÒNG LẶP RENDER & HIT-TEST ---
        function animate() { renderer.setAnimationLoop(render); }

        function render(timestamp, frame) {
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                // Nếu chưa có phòng, quét sàn thật
                if (!mainRoom) {
                    if (!hitTestSourceRequested) {
                        session.requestReferenceSpace('viewer').then(ref => {
                            session.requestHitTestSource({ space: ref }).then(src => hitTestSource = src);
                        });
                        hitTestSourceRequested = true;
                    }
                    if (hitTestSource) {
                        const results = frame.getHitTestResults(hitTestSource);
                        if (results.length > 0) {
                            const hit = results[0];
                            reticle.visible = true;
                            reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                            if(!planeFound) { 
                                planeFound = true; 
                                document.getElementById('status-bar').innerText = "Đã thấy mặt sàn thực!"; 
                            }
                        } else { reticle.visible = false; }
                    }
                } 
                // Nếu đã có phòng, Raycast lên bề mặt ảo của phòng
                else {
                    const tempMatrix = new THREE.Matrix4().identity().extractRotation(controller.matrixWorld);
                    raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
                    raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

                    const intersects = raycaster.intersectObject(mainRoom, true);
                    if (intersects.length > 0) {
                        reticle.visible = true;
                        const hitPoint = intersects[0].point;
                        // Khóa vật thể trong phạm vi phòng
                        if(mainRoom.userData.box) hitPoint.clamp(mainRoom.userData.box.min, mainRoom.userData.box.max);
                        
                        const m = new THREE.Matrix4().makeTranslation(hitPoint.x, hitPoint.y, hitPoint.z);
                        reticle.matrix.copy(m);
                    } else { reticle.visible = false; }
                }
            }
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
