<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demo AR - VKU AR DrawRoom (A-Frame)</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/components.js" defer></script>

    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

    <style>
      .model-carousel {
        display: flex;
        overflow-x: auto;
        gap: 15px;
        padding: 15px 5px;
        margin-top: 15px;
        scrollbar-width: none; 
        -ms-overflow-style: none; 
      }
      .model-carousel::-webkit-scrollbar {
        display: none; 
      }
      
      .model-card {
        flex: 0 0 auto;
        width: 110px;
        background: rgba(18, 35, 67, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 15px 10px;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        color: var(--text-muted);
        backdrop-filter: blur(5px);
      }
      
      .model-card:hover {
        background: rgba(255, 255, 255, 0.05);
        transform: translateY(-3px);
      }
      
      .model-card.active {
        border-color: var(--ar-cyan, #00e5ff);
        background: rgba(0, 229, 255, 0.08);
        color: #fff;
        box-shadow: 0 0 20px rgba(0, 229, 255, 0.2), inset 0 0 10px rgba(0, 229, 255, 0.1);
      }
      
      .model-icon {
        font-size: 28px;
        margin-bottom: 8px;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
      }
      
      .model-name {
        font-size: 12px;
        font-weight: 600;
        font-family: 'Space Grotesk', sans-serif;
        line-height: 1.2;
      }

      /* TÙY CHỈNH KHUNG HIỂN THỊ A-FRAME */
      #aframe-container {
        width: 100%;
        height: 50vh;
        border-radius: 16px;
        overflow: hidden; /* Cắt bỏ phần dư để giữ góc bo tròn */
        position: relative;
        background-color: #b5c6d0; /* Màu nền giống model-viewer neutral */
        box-shadow: inset 0 0 20px rgba(0,0,0,0.2);
      }

      /* Nút AR mặc định của A-Frame sẽ nằm ở góc dưới bên phải. 
         Bạn có thể style thêm cho nó thông qua class .a-enter-ar */
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div class="loader-core"></div>
      <div class="loader-text">INITIALIZING AR ENGINE...</div>
    </div>

    <vku-header></vku-header>

    <main>
      <h1 class="gradient-text" style="text-align: center; font-size: 2.8rem">
        Truy Cập AR Camera
      </h1>

      <div
        style="
          max-width: 700px;
          margin: 0 auto 30px auto;
          background: rgba(255, 193, 7, 0.1);
          border: 1px solid rgba(255, 193, 7, 0.3);
          padding: 15px 25px;
          border-radius: 12px;
          text-align: center;
        "
      >
        <p style="color: var(--vku-gold); margin: 0; font-size: 15px">
          <strong><span style="font-size: 18px">⚠️</span> PROTOCOL:</strong>
          Vuốt chọn mô hình bên dưới. Nhấn nút <strong>AR</strong> ở góc phải khung hình để mở Camera và quét mặt sàn.
        </p>
      </div>

      <div class="ar-container" style="max-width: 900px; margin: 0 auto">
        
        <div id="aframe-container">
          
          <a-scene embedded xr-mode-ui="XRMode: ar" vr-mode-ui="enabled: false">
            
            <a-light type="ambient" color="#ffffff" intensity="1.2"></a-light>
            <a-light type="directional" color="#ffffff" intensity="0.8" position="1 2 1"></a-light>

            <a-camera position="0 1.2 2"></a-camera>

            <a-entity
              id="main-model"
              gltf-model="url(models/living room_furniture.glb)"
              scale="0.5 0.5 0.5"
              position="0 0 -1.5"
              animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear">
            </a-entity>

          </a-scene>

        </div>

        <div class="model-carousel">
            
            <div class="model-card active" onclick="selectModel('models/living room_furniture.glb', this)">
                <div class="model-icon">🛋️</div>
                <div class="model-name">Phòng Khách</div>
            </div>

            <div class="model-card" onclick="selectModel('models/phong_hoc_thpt_phong_phu.glb', this)">
                <div class="model-icon">🏫</div>
                <div class="model-name">Phòng Vẽ VKU</div>
            </div>

            <div class="model-card" onclick="selectModel('models/Meshy_AI_Elemental_Thunderbird_0314181252_texture.glb', this)">
                <div class="model-icon">🦅</div>
                <div class="model-name">Thunderbird</div>
            </div>

        </div>
      </div>
    </main>

    <vku-footer></vku-footer>

    <script>
      function selectModel(srcUrl, clickedCard) {
        // 1. Tìm Entity chứa mô hình trong A-Frame
        const modelEntity = document.getElementById('main-model');
        
        // 2. Set lại thuộc tính gltf-model với đường dẫn mới (Bắt buộc dùng cú pháp url(...) của A-Frame)
        modelEntity.setAttribute('gltf-model', 'url(' + srcUrl + ')');

        // 3. Xóa trạng thái sáng ở tất cả các nút
        const allCards = document.querySelectorAll('.model-card');
        allCards.forEach(card => card.classList.remove('active'));

        // 4. Bật sáng nút vừa bấm
        clickedCard.classList.add('active');
      }
    </script>
  </body>
</html>
