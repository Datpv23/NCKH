<!doctype html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VKU AR - Full CMS & WebXR Edition</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/components.js" defer></script>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <style>
        /* --- TÙY CHỈNH KHU VỰC AR --- */
        .ar-container { position: relative; max-width: 900px; margin: 0 auto; overflow: hidden; border-radius: 16px; }
        .menu-toggle-btn {
            position: absolute; top: 15px; left: 15px; z-index: 10;
            background: rgba(18, 35, 67, 0.85); color: white; border: 1px solid var(--ar-cyan, #00e5ff);
            padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; backdrop-filter: blur(5px);
        }
        .menu-toggle-btn:hover { background: rgba(0, 229, 255, 0.2); }

        /* --- SIDEBAR MENU --- */
        .side-menu {
            position: absolute; top: 0; left: -100%; width: 300px; height: 100%;
            background: rgba(11, 20, 38, 0.95); z-index: 20; transition: left 0.4s ease; 
            display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px);
        }
        .side-menu.open { left: 0; }
        .menu-header { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); color: white; }
        .menu-header h3 { margin: 0; font-size: 16px; }
        .icon-btn { background: none; border: none; color: white; font-size: 18px; cursor: pointer; }
        .icon-btn:hover { color: #00e5ff; }
        #back-btn { display: none; font-size: 14px; color: #94a3b8; }
        .menu-content { flex: 1; overflow-y: auto; padding: 15px; }

        /* Nút chung */
        .category-item {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            padding: 15px; margin-bottom: 10px; border-radius: 10px; color: white; cursor: pointer; font-weight: bold;
            display: flex; justify-content: space-between;
        }
        .category-item:hover { background: rgba(0, 229, 255, 0.1); border-color: #00e5ff; }

        /* --- LƯỚI VẬT THỂ & NÚT XÓA --- */
        .items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .model-card {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden; cursor: pointer; text-align: center; position: relative;
        }
        .model-card:hover { border-color: #00e5ff; }
        .model-img { width: 100%; height: 80px; object-fit: cover; background-color: #fff; }
        .model-name { padding: 8px 5px; color: white; font-size: 11px; font-weight: 600; }
        
        .delete-btn {
            position: absolute; top: 5px; right: 5px; background: rgba(200, 16, 46, 0.9);
            color: white; border: none; border-radius: 5px; padding: 4px; font-size: 12px; cursor: pointer;
        }
        .delete-btn:hover { background: red; transform: scale(1.1); }

        /* Nút thêm mới */
        .add-btn { background: #00e5ff; color: #0b1426; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px; }
        
        /* --- MODAL THÊM VẬT THỂ --- */
        #admin-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 99999; justify-content: center; align-items: center; backdrop-filter: blur(5px);
        }
        .modal-content {
            background: #122343; padding: 20px; border-radius: 16px; width: 90%; max-width: 400px;
            color: white; border: 1px solid #00e5ff; box-shadow: 0 10px 30px rgba(0,229,255,0.2);
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; margin-bottom: 5px; color: #94a3b8; }
        .form-group input[type="text"], .form-group select {
            width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.3); color: white; box-sizing: border-box;
        }
        .form-group input[type="file"] {
            width: 100%; padding: 8px; font-size: 13px; color: #94a3b8;
            background: rgba(0,0,0,0.2); border: 1px dashed rgba(255,255,255,0.3); border-radius: 8px;
        }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-cancel { flex: 1; padding: 10px; background: #475569; color: white; border: none; border-radius: 8px; cursor: pointer;}
        .btn-submit { flex: 1; padding: 10px; background: #00e5ff; color: #0b1426; font-weight: bold; border: none; border-radius: 8px; cursor: pointer;}
        .btn-submit:disabled { cursor: not-allowed; opacity: 0.8; }

        /* --- THREE.JS CONTAINER --- */
        #container-3d {
            width: 100%; height: 60vh; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #0b1426, #122343); position: relative;
        }
        
        /* Ghi đè CSS nút AR mặc định của ThreeJS */
        #ARButton {
            bottom: 20px !important;
            padding: 12px 24px !important;
            border-radius: 8px !important;
            background-color: #00e5ff !important;
            color: #0b1426 !important;
            font-weight: bold !important;
            font-family: inherit !important;
            border: none !important;
            box-shadow: 0 4px 15px rgba(0,229,255,0.4) !important;
            z-index: 10 !important;
            left: 50% !important;
            transform: translateX(-50%) !important;
            margin-left: 0 !important;
        }
        
        #placement-indicator {
            position:absolute; top: 15px; right: 15px; background: rgba(0,0,0,0.7); color: #fff; border: 1px solid #00e5ff; padding: 8px 15px; border-radius: 8px; font-size: 13px; font-weight: bold; z-index: 5; display: none; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div id="splash-screen"><div class="loader-core"></div><div class="loader-text">INITIALIZING AR ENGINE...</div></div>
    <vku-header></vku-header>

    <main>
        <h1 class="gradient-text" style="text-align: center; font-size: 2.8rem">Truy Cập AR Camera</h1>
        <div style="max-width: 700px; margin: 0 auto 30px auto; background: rgba(255, 193, 7, 0.1); border: 1px solid rgba(255, 193, 7, 0.3); padding: 15px 25px; border-radius: 12px; text-align: center;">
            <p style="color: var(--vku-gold); margin: 0; font-size: 15px">
                <strong><span style="font-size: 18px">⚠️</span> PROTOCOL:</strong>
                Mở <strong>Menu</strong> để chọn vật thể. Bấm <strong>Start AR</strong>, quét sàn nhà cho tới khi thấy vòng tròn, <strong>Chạm màn hình</strong> để đặt nhiều vật thể tạo thành phòng.
            </p>
        </div>

        <div class="ar-container">
            <button class="menu-toggle-btn" onclick="toggleMenu()">☰ Menu Đồ Vật</button>
            <div id="placement-indicator">Vật đang chọn: <span id="current-model-name" style="color:#00e5ff;">Chưa có</span></div>

            <div id="side-menu" class="side-menu">
                <div class="menu-header">
                    <button id="back-btn" class="icon-btn" onclick="renderCategories()">⬅</button>
                    <h3 id="menu-title">Danh Mục</h3>
                    <button class="icon-btn" onclick="toggleMenu()">✖</button>
                </div>
                <div id="menu-content" class="menu-content"><p style="color: #00e5ff;">Đang tải...</p></div>
                <div style="padding: 15px; border-top: 1px solid rgba(255,255,255,0.1);">
                    <button class="add-btn" onclick="openModal()">➕ Thêm Vật Thể Mới</button>
                </div>
            </div>
            
            <div id="container-3d"></div>
        </div>
    </main>

    <div id="admin-modal">
        <div class="modal-content">
            <h3 style="margin-top: 0; color: #00e5ff; text-align: center;">Thêm Vật Thể Mới</h3>
            <form id="add-form" onsubmit="submitNewModel(event)">
                <div class="form-group">
                    <label>Tên hiển thị:</label>
                    <input type="text" id="inp-name" required placeholder="VD: Bàn học gỗ">
                </div>
                <div class="form-group">
                    <label>Danh mục (Lấy từ Firebase):</label>
                    <select id="inp-category" required></select>
                </div>
                <div class="form-group">
                    <label>Chọn Ảnh hiển thị (.png, .jpg):</label>
                    <input type="file" id="inp-image-file" accept="image/*" required>
                </div>
                <div class="form-group">
                    <label>Chọn File 3D (.glb):</label>
                    <input type="file" id="inp-model-file" accept=".glb" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="btn-submit" id="btn-save">Tải Lên & Lưu</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module">
        // Firebase Setup
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        
        // Three.js Setup
        import * as THREE from 'three';
        import { ARButton } from 'three/addons/webxr/ARButton.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        // ==========================================
        // 1. CLOUDINARY & FIREBASE CONFIG
        // ==========================================
        const CLOUDINARY_URL = "https://api.cloudinary.com/v1_1/dhkshat4s/auto/upload";
        const CLOUDINARY_PRESET = "vku_ar_preset"; 

        const firebaseConfig = {
            apiKey: "AIzaSyCQjyaUgKxHqgfW3aaxsgwxUfOPePCkVVA",
            authDomain: "vku-ar-project.firebaseapp.com",
            projectId: "vku-ar-project",
            storageBucket: "vku-ar-project.firebasestorage.app",
            messagingSenderId: "595437202444",
            appId: "1:595437202444:web:7939802383d326eee75229",
            measurementId: "G-QS4HC8MPGT"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // ==========================================
        // 2. THREE.JS & WEBXR LOGIC
        // ==========================================
        let camera, scene, renderer;
        let controller, reticle;
        let hitTestSource = null;
        let hitTestSourceRequested = false;
        
        let currentLoadedModel = null; // Vật thể đã được tải để đặt
        let previewGroup; // Nhóm chứa vật thể xem trước (khi chưa vô AR)
        const gltfLoader = new GLTFLoader();

        initThreeJS();

        function initThreeJS() {
            const container = document.getElementById('container-3d');
            scene = new THREE.Scene();
            
            camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.01, 20);
            
            // Ánh sáng cho mô hình sáng đẹp
            const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
            hemiLight.position.set(0.5, 1, 0.25);
            scene.add(hemiLight);
            
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(0, 2, 0);
            scene.add(dirLight);

            // Group xem trước 3D (xoay xoay)
            previewGroup = new THREE.Group();
            scene.add(previewGroup);
            camera.position.set(0, 1, 3); // Góc camera khi chưa vào AR

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.xr.enabled = true;
            container.appendChild(renderer.domElement);

            // Thêm nút AR
            const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
            container.appendChild(arButton);

            // Sự kiện WebXR
            controller = renderer.xr.getController(0);
            controller.addEventListener('select', onSelect); // Chạm để đặt
            scene.add(controller);

            // Vòng tròn định vị mặt phẳng (Reticle)
            const geometry = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
            const material = new THREE.MeshBasicMaterial({ color: 0x00e5ff });
            reticle = new THREE.Mesh(geometry, material);
            reticle.matrixAutoUpdate = false;
            reticle.visible = false;
            scene.add(reticle);

            // Ẩn preview khi vào AR
            renderer.xr.addEventListener('sessionstart', () => { previewGroup.visible = false; });
            renderer.xr.addEventListener('sessionend', () => { previewGroup.visible = true; });

            window.addEventListener('resize', onWindowResize);
            renderer.setAnimationLoop(animate);
            
            // Ẩn splash screen sau khi khởi tạo
            const splash = document.getElementById('splash-screen');
            if(splash) splash.style.display = 'none';
        }

        // HÀM CHẠM MÀN HÌNH ĐỂ ĐẶT VẬT THỂ
        function onSelect() {
            if (reticle.visible && currentLoadedModel) {
                const clone = currentLoadedModel.clone();
                clone.position.setFromMatrixPosition(reticle.matrix);
                // Tạo hướng xoay ngẫu nhiên chút cho tự nhiên hoặc hướng về camera
                scene.add(clone);
            }
        }

        function onWindowResize() {
            const container = document.getElementById('container-3d');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate(timestamp, frame) {
            // Xoay preview khi chưa vào AR
            if (!renderer.xr.isPresenting) {
                previewGroup.rotation.y += 0.01;
            }

            // WebXR Hit Test Logic
            if (frame) {
                const referenceSpace = renderer.xr.getReferenceSpace();
                const session = renderer.xr.getSession();

                if (hitTestSourceRequested === false) {
                    session.requestReferenceSpace('viewer').then(function (referenceSpace) {
                        session.requestHitTestSource({ space: referenceSpace }).then(function (source) {
                            hitTestSource = source;
                        });
                    });
                    session.addEventListener('end', function () {
                        hitTestSourceRequested = false;
                        hitTestSource = null;
                    });
                    hitTestSourceRequested = true;
                }

                if (hitTestSource) {
                    const hitTestResults = frame.getHitTestResults(hitTestSource);
                    if (hitTestResults.length > 0) {
                        const hit = hitTestResults[0];
                        reticle.visible = true;
                        reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
                    } else {
                        reticle.visible = false;
                    }
                }
            }
            renderer.render(scene, camera);
        }

        // ==========================================
        // 3. UI & FIREBASE LOGIC
        // ==========================================
        let categoryDisplayNames = {}; 
        let modelDatabase = {};        

        const menuContent = document.getElementById('menu-content');
        const menuTitle = document.getElementById('menu-title');
        const backBtn = document.getElementById('back-btn');
        const sideMenu = document.getElementById('side-menu');

        window.toggleMenu = function() {
            sideMenu.classList.toggle('open');
            if(sideMenu.classList.contains('open') && Object.keys(modelDatabase).length > 0 && !backBtn.style.display.includes('block')) {
                window.renderCategories();
            }
        }

        window.fetchFromFirebase = async function() {
            try {
                const catSnapshot = await getDocs(collection(db, "categories"));
                categoryDisplayNames = {};
                catSnapshot.forEach((doc) => { categoryDisplayNames[doc.id] = doc.data().name; });

                const modelSnapshot = await getDocs(collection(db, "models"));
                modelDatabase = {}; 
                let firstModelUrl = "";
                let firstModelName = "";

                modelSnapshot.forEach((doc) => {
                    const data = doc.data();
                    const catCode = data.category || "khac"; 
                    if (!modelDatabase[catCode]) modelDatabase[catCode] = [];

                    modelDatabase[catCode].push({
                        id: doc.id, 
                        name: data.name || "Chưa tên",
                        url: data.url,
                        image: data.image || "https://placehold.co/200x150/e2e8f0/1e293b?text=No+Image"
                    });
                    if(!firstModelUrl) { firstModelUrl = data.url; firstModelName = data.name; }
                });

                if(firstModelUrl && !currentLoadedModel) {
                    window.loadModelToScene(firstModelUrl, firstModelName);
                }
                window.renderCategories();

            } catch (error) {
                console.error("Lỗi:", error);
                menuContent.innerHTML = '<p style="color: #ff2a4b;">Lỗi kết nối Firebase!</p>';
            }
        }

        window.renderCategories = function() {
            menuTitle.innerText = "Danh Mục Đồ Vật";
            backBtn.style.display = 'none'; 
            menuContent.innerHTML = ''; 

            Object.keys(categoryDisplayNames).forEach(catCode => {
                const div = document.createElement('div');
                div.className = 'category-item';
                div.innerHTML = `<span>${categoryDisplayNames[catCode]}</span> <span>❯</span>`;
                div.onclick = () => window.renderItems(catCode, categoryDisplayNames[catCode]);
                menuContent.appendChild(div);
            });
        }

        window.renderItems = function(catCode, displayName) {
            menuTitle.innerText = displayName; 
            backBtn.style.display = 'block'; 
            menuContent.innerHTML = ''; 
            
            const items = modelDatabase[catCode] || [];
            if(items.length === 0) { menuContent.innerHTML = "<p style='color:gray;'>Chưa có vật thể.</p>"; return; }

            const gridDiv = document.createElement('div');
            gridDiv.className = 'items-grid';

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <button class="delete-btn" onclick="deleteModel('${item.id}', event)">🗑️</button>
                    <img src="${item.image}" class="model-img" loading="lazy">
                    <div class="model-name">${item.name}</div>
                `;

                // KHI CHỌN VẬT THỂ TỪ MENU -> LOAD VÀO SCENE
                card.onclick = () => {
                    window.loadModelToScene(item.url, item.name);
                    window.toggleMenu(); 
                };

                gridDiv.appendChild(card);
            });
            menuContent.appendChild(gridDiv);
        }

        // HÀM TẢI MODEL VÀO TRONG BỘ NHỚ ĐỂ CHUẨN BỊ ĐẶT
        window.loadModelToScene = function(url, name) {
            document.getElementById('placement-indicator').style.display = 'block';
            document.getElementById('current-model-name').innerText = "Đang tải...";
            document.getElementById('current-model-name').style.color = "#ffeb3b";

            gltfLoader.load(url, function (gltf) {
                currentLoadedModel = gltf.scene;

                // Chuẩn bị Preview
                while(previewGroup.children.length > 0){ 
                    previewGroup.remove(previewGroup.children[0]); 
                }
                const previewModel = currentLoadedModel.clone();
                
                // Căn giữa model xem trước
                const box = new THREE.Box3().setFromObject(previewModel);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                previewModel.position.sub(center); // Đưa về gốc tọa độ
                
                // Thu nhỏ nếu vật thể quá to so với camera preview
                const maxDim = Math.max(size.x, size.y, size.z);
                if(maxDim > 2) previewModel.scale.setScalar(2 / maxDim);
                
                previewGroup.add(previewModel);

                document.getElementById('current-model-name').innerText = name;
                document.getElementById('current-model-name').style.color = "#00e5ff";
            }, undefined, function (error) {
                console.error(error);
                document.getElementById('current-model-name').innerText = "Lỗi tải file!";
                document.getElementById('current-model-name').style.color = "red";
            });
        }

        window.deleteModel = async function(docId, event) {
            event.stopPropagation(); 
            const confirmDelete = confirm("Bạn có chắc chắn muốn xóa vật thể này khỏi hệ thống?");
            if (confirmDelete) {
                try {
                    await deleteDoc(doc(db, "models", docId)); 
                    alert("Đã xóa thành công!");
                    window.fetchFromFirebase(); 
                } catch (error) { alert("Lỗi khi xóa: " + error.message); }
            }
        }

        // QUẢN LÝ MODAL (FORM)
        window.openModal = function() {
            const selectEl = document.getElementById('inp-category');
            selectEl.innerHTML = ''; 
            Object.keys(categoryDisplayNames).forEach(catCode => {
                const option = document.createElement('option');
                option.value = catCode;
                option.text = categoryDisplayNames[catCode];
                selectEl.appendChild(option);
            });
            document.getElementById('admin-modal').style.display = 'flex';
        }

        window.closeModal = function() {
            document.getElementById('admin-modal').style.display = 'none';
            document.getElementById('add-form').reset();
            document.getElementById('btn-save').innerText = "Tải Lên & Lưu";
            document.getElementById('btn-save').disabled = false;
            document.getElementById('btn-save').style.background = "#00e5ff";
        }

        async function uploadFileToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_PRESET);
            const response = await fetch(CLOUDINARY_URL, { method: 'POST', body: formData });
            const data = await response.json();
            if (data.secure_url) return data.secure_url;
            else throw new Error(data.error?.message || "Tải file thất bại");
        }

        window.submitNewModel = async function(event) {
            event.preventDefault(); 
            const btnSave = document.getElementById('btn-save');
            const imgFile = document.getElementById('inp-image-file').files[0];
            const modelFile = document.getElementById('inp-model-file').files[0];

            if(!imgFile || !modelFile) { alert("Vui lòng chọn đầy đủ Ảnh và File 3D!"); return; }

            btnSave.disabled = true; btnSave.style.background = "#475569"; 

            try {
                btnSave.innerText = "⏳ Đang tải ảnh lên Cloudinary...";
                const imageUrl = await uploadFileToCloudinary(imgFile);

                btnSave.innerText = "⏳ Đang tải mô hình 3D (Vui lòng chờ)...";
                const modelUrl = await uploadFileToCloudinary(modelFile);

                btnSave.innerText = "⏳ Đang đồng bộ với Firebase...";
                const newModel = {
                    name: document.getElementById('inp-name').value,
                    category: document.getElementById('inp-category').value,
                    image: imageUrl,
                    url: modelUrl
                };

                await addDoc(collection(db, "models"), newModel);
                alert("🎉 Đã thêm vật thể mới thành công!");
                window.closeModal();
                window.fetchFromFirebase(); 
            } catch (error) {
                console.error("Lỗi Upload:", error);
                alert("🚨 Lỗi: " + error.message);
                btnSave.innerText = "Thử lại";
                btnSave.disabled = false; btnSave.style.background = "#ff2a4b";
            }
        }

        // CHẠY APP
        window.fetchFromFirebase();
    </script>
</body>
</html>
